<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="alabsgold-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Gold Left Facet -->
    <linearGradient id="gold-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Gold Right Facet -->
    <linearGradient id="gold-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="40%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Gold Crossbar -->
    <linearGradient id="gold-cross" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Ambient Gold Glow -->
    <radialGradient id="gold-radial-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="100" height="100" rx="22" fill="url(#alabsgold-bg)" stroke="#27272a" stroke-width="2.5" />
  
  <!-- Subtle Internal Radial Glow -->
  <circle cx="50" cy="50" r="38" fill="url(#gold-radial-glow)" />

  <!-- The Architectural ALABSGOLD 'A' Monogram -->
  <!-- Left Pillar / Strut -->
  <path d="M 50 16 L 22 84 L 36 84 L 46 58 L 50 58 Z" fill="url(#gold-left)" />
  
  <!-- Right Pillar / Strut -->
  <path d="M 50 16 L 78 84 L 64 84 L 54 58 L 50 58 Z" fill="url(#gold-right)" />
  
  <!-- Inner Apex Highlight -->
  <polygon points="50,26 44,48 56,48" fill="#fef08a" opacity="0.95" />

  <!-- Signature Architectural Crossbar Chevron -->
  <path d="M 33 66 L 50 56 L 67 66 L 50 73 Z" fill="url(#gold-cross)" />
  
  <!-- Active Studio Operational Indicator -->
  <circle cx="82" cy="82" r="5.5" fill="#10b981" stroke="#09090b" stroke-width="2" />
</svg>
